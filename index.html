
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">GAME <span>HUB</span></div>
  <div class="user-area">
    <input id="username" placeholder="نام کاربری">
    <button onclick="saveUser()">ثبت نام کاربری</button>
  </div>
  <p id="userCode"></p>
</header>

<main>
  <section class="hero">
    <p class="tag">CALL OF DUTY MOBILE</p>
    <h1>به دنیای رقابت خوش آمدی</h1>
    <p>رقابت کن، پیروز شو و جایزه بگیر!</p>
  </section>

  <h2>انتخاب مسابقه</h2>
  <section class="cards">
    <div class="card">
      <h3>مسابقه انفرادی</h3>
      <p>به تنهایی وارد میدان شو و رقابت کن.</p>
      <button>مشاهده مسابقات</button>
    </div>

    <div class="card">
      <h3>مسابقه تیمی</h3>
      <p>با دوستانت تیم بساز و رقابت کن.</p>
      <button>مشاهده مسابقات</button>
    </div>
  </section>

  <h2>مسابقات فعال</h2>
  <section class="active">
    <p>هنوز مسابقه‌ای ثبت نشده است.</p>
  </section>
</main>

<footer>GAME HUB | دنیای رقابت</footer>

<script>
function saveUser() {
  const input = document.getElementById("username");
  const name = input.value.trim();

  if (!name) {
    alert("لطفاً نام کاربری را وارد کن.");
    return;
  }

  let code = localStorage.getItem("gameHubCode");

  if (!code) {
    code = "GH-" + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem("gameHubCode", code);
  }

  localStorage.setItem("gameHubUsername", name);
  showUser();
}

function showUser() {
  const name = localStorage.getItem("gameHubUsername");
  const code = localStorage.getItem("gameHubCode");

  if (name && code) {
    document.getElementById("username").value = name;
    document.getElementById("userCode").textContent =
      "سلام " + name + " | کد کاربری: " + code;
  }
}

showUser();
</script>

</body>
</html>
